
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-candidaturas-global"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35,<2",
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
    "google-genai>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
